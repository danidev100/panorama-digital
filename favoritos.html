<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Tu lista personalizada de noticias favoritas en Panorama Digital.">
  <title>Favoritos | Panorama Digital</title>
  <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:wght@700;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/styles.css" rel="stylesheet">
</head>
<body>
  <header id="app-header"></header>

  <main>
    <section class="encabezado-pagina">
      <div class="container d-flex flex-wrap justify-content-between align-items-center gap-3">
        <div>
          <h1><i class="bi bi-star-fill text-acento me-2"></i>Mis favoritos</h1>
          <p>Tu lista personalizada, guardada en este navegador.</p>
        </div>
        <button type="button" id="btn-vaciar" class="btn btn-outline-light d-none">
          <i class="bi bi-trash3 me-1"></i>Vaciar lista
        </button>
      </div>
    </section>

    <div class="container">
      <div id="lista-favoritos" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" aria-live="polite">
        <div class="col"><div class="skeleton"></div></div>
      </div>
    </div>
  </main>

  <footer id="app-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="assets/js/pages/favoritos.js"></script>
</body>
</html>
