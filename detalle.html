<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Detalle de la noticia en Panorama Digital.">
  <title>Noticia | Panorama Digital</title>
  <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:wght@700;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/styles.css" rel="stylesheet">
  <!-- Sistema de movimiento: transiciones entre páginas y microinteracciones -->
  <link href="assets/css/motion.css" rel="stylesheet">
</head>
<body>
  <header id="app-header"></header>

  <main class="container py-4">
    <!-- Migas de pan: las dos primeras son fijas; el título se agrega al cargar la noticia -->
    <nav aria-label="Ruta de navegación" class="migas mb-3">
      <ol class="breadcrumb mb-0" id="migas">
        <li class="breadcrumb-item"><a href="index.html">Inicio</a></li>
        <li class="breadcrumb-item"><a href="noticias.html">Noticias</a></li>
      </ol>
    </nav>

    <!-- Imagen principal. Existe desde el primer cuadro para que la transición pueda
         "hacer crecer" la imagen de la tarjeta pulsada hasta esta posición. -->
    <img id="detalle-imagen" class="detalle-imagen mb-4" alt="" hidden>

    <!-- Contenedor que se llena con la noticia indicada en la URL (?id=N) -->
    <article id="detalle-noticia" aria-live="polite">
      <div class="skeleton" style="height: 320px"></div>
    </article>

    <!-- ===== Noticias relacionadas (misma categoría) ===== -->
    <section id="seccion-relacionadas" class="mt-5 d-none" aria-labelledby="titulo-relacionadas" data-revelar>
      <h2 id="titulo-relacionadas" class="titulo-seccion">Noticias relacionadas</h2>
      <div id="lista-relacionadas" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4"></div>
    </section>
  </main>

  <footer id="app-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- blocking="render": el header se dibuja antes del primer cuadro, evitando parpadeos al navegar -->
  <script type="module" src="assets/js/pages/detalle.js" blocking="render"></script>
</body>
</html>
