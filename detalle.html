<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Detalle de la noticia en Panorama Digital.">
  <title>Noticia | Panorama Digital</title>
  <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:wght@700;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/styles.css" rel="stylesheet">
</head>
<body>
  <header id="app-header"></header>

  <main class="container py-4">
    <!-- Contenedor que se llena con la noticia indicada en la URL (?id=N) -->
    <article id="detalle-noticia" aria-live="polite">
      <div class="skeleton" style="height: 420px"></div>
    </article>

    <!-- ===== Noticias relacionadas (misma categoría) ===== -->
    <section id="seccion-relacionadas" class="mt-5 d-none" aria-labelledby="titulo-relacionadas">
      <h2 id="titulo-relacionadas" class="titulo-seccion">Noticias relacionadas</h2>
      <div id="lista-relacionadas" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4"></div>
    </section>
  </main>

  <footer id="app-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="assets/js/pages/detalle.js"></script>
</body>
</html>
