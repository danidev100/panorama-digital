<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Categorías de noticias de Panorama Digital: tecnología, turismo, educación y negocios.">
  <title>Categorías | Panorama Digital</title>
  <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:wght@700;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/styles.css" rel="stylesheet">
  <!-- Sistema de movimiento: transiciones entre páginas y microinteracciones -->
  <link href="assets/css/motion.css" rel="stylesheet">
</head>
<body>
  <header id="app-header"></header>

  <main>
    <section class="encabezado-pagina">
      <div class="container">
        <h1>Categorías</h1>
        <p>Elige un tema y descubre las noticias relacionadas.</p>
      </div>
    </section>

    <div class="container">
      <!-- Tarjetas de categoría con el número de noticias de cada una -->
      <div id="lista-categorias" class="row row-cols-1 row-cols-md-2 g-4">
        <div class="col"><div class="skeleton"></div></div>
        <div class="col"><div class="skeleton"></div></div>
      </div>
    </div>
  </main>

  <footer id="app-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- blocking="render": el header se dibuja antes del primer cuadro, evitando parpadeos al navegar -->
  <script type="module" src="assets/js/pages/categorias.js" blocking="render"></script>
</body>
</html>
